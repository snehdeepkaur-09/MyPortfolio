<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#008080">
  <meta name="robots" content="noindex, nofollow">
  <title>Portfolio Coming Soon | Snehdeep Kaur</title>
  <style>
    :root { color-scheme: light; --teal: #008080; --pink: #ffe4ed; --ink: #163f40; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; padding: 24px;
      display: grid; place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: linear-gradient(145deg, #fff9fb 0%, var(--pink) 100%);
    }
    main {
      position: relative; isolation: isolate; overflow: hidden;
      width: min(760px, 100%); padding: clamp(36px, 7vw, 76px) 28px;
      text-align: center; border-radius: 28px;
      background: #fff; border: 1px solid rgba(0,128,128,.13);
      box-shadow: 0 22px 70px rgba(0, 80, 80, .12);
    }
    main::before, main::after {
      content: ""; position: absolute; z-index: -1; border-radius: 50%;
      border: 1px solid rgba(0,128,128,.13); pointer-events: none;
    }
    main::before { width: 260px; height: 260px; top: -160px; right: -70px; }
    main::after { width: 200px; height: 200px; bottom: -140px; left: -60px; }
    .monogram {
      display: grid; place-items: center; width: 66px; height: 66px;
      margin: 0 auto 26px; border-radius: 50%; color: var(--pink);
      background: var(--teal); font-weight: 700; letter-spacing: -.04em;
    }
    .eyebrow { margin: 0 0 14px; color: var(--teal); font-size: .76rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0; color: var(--teal); font-size: clamp(2.2rem, 7vw, 4rem); line-height: 1.08; letter-spacing: -.045em; }
    .message { max-width: 520px; margin: 22px auto 0; font-size: clamp(1rem, 2.5vw, 1.16rem); line-height: 1.8; color: #4b6666; }
    .rule { width: 56px; height: 4px; margin: 30px auto; border-radius: 4px; background: var(--pink); }
    footer { color: #648080; font-size: .9rem; }
    @media (prefers-reduced-motion: no-preference) {
      main { animation: appear .5s ease-out both; }
      @keyframes appear { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    }
  </style>
</head>
<body>
  <main>
    <div class="monogram" aria-hidden="true">SK</div>
    <p class="eyebrow">Snehdeep Kaur · Portfolio</p>
    <h1>Something new is on its way.</h1>
    <p class="message">My portfolio is currently being updated to bring you a better experience. Please check back soon — the refreshed portfolio will be available shortly.</p>
    <div class="rule" aria-hidden="true"></div>
    <footer>Thank you for your patience.</footer>
  </main>
</body>
</html>
